{% load bootstrap4 %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
    {% bootstrap_css %}
</head>
<body>
    <div class="container">
        <h1>Contato</h1>
        {% bootstrap_messages %} <!-- Mensagem de exito do bootstrap -->

        <form action="{% url 'contato' %}" method="post" class="form" autocomplete="off"> <!-- Envia as informações do formulário pra url de contato -->
            {% csrf_token %} <!-- segurança de tabela essencial -->
            {% bootstrap_form form %} <!-- Pro bootstrap aplicar o css -->
            {% buttons %}
                <button type="submit" class="btn-primary">Enviar Mensagem</button>
            {% endbuttons %}
        </form>
    </div>
{% bootstrap_javascript jquery='full' %}
</body>
</html>
